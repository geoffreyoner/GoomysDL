services:
  app:
    build: .
    restart: unless-stopped
    environment:
      MAX_FILE_MB: ${MAX_FILE_MB:-500}
      # YTDLP_COOKIES: /app/cookies.txt
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env, e.g. dl.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
